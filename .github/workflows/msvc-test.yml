name: "Windows & Android Test"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-test-${{ github.ref }}
  cancel-in-progress: true

env:
  ZSTD_CLEVEL: 17
  VCPKG_BINARY_SOURCES: clear

jobs:
  msvc:
    name: Windows Tiles x64 MSVC
    runs-on: windows-2022

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: "9dd12f8d791f6fa4e396adbebc714d51cbee2143"

      - name: Integrate vcpkg
        run: |
          vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        id: cache-vcpkg
        with:
          path: msvc-full-features/vcpkg_installed/
          key: vcpkg-${{ hashFiles('msvc-full-features/vcpkg.json') }}-${{ hashFiles('.github/vcpkg_triplets/x64-windows-static.cmake') }}-9dd12f8d791f6fa4e396adbebc714d51cbee2143

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make

      - name: Create VERSION.txt
        shell: bash
        run: |
          cat >VERSION.txt <<EOL
          build type: windows-tiles-x64-msvc-test
          workflow run: ${{ github.run_number }}
          branch: ${{ github.ref_name }}
          commit sha: ${{ github.sha }}
          commit url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          EOL

      - name: Compile translations
        shell: msys2 {0}
        run: |
          lang/compile_mo.sh all

      - name: Build Windows Tiles x64 MSVC
        env:
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
          VCPKG_BINARY_SOURCES: clear
        run: |
          msbuild -m -p:Configuration=Release -p:Platform=x64 "-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static" msvc-full-features\Cataclysm-vcpkg-static.sln
          .\build-scripts\windist.ps1
          Expand-Archive -LiteralPath cataclysmdda-0.G.zip -DestinationPath windows-test-build -Force

      - name: Validate embedded weapon workshop
        shell: pwsh
        run: |
          $requiredFiles = @(
            "windows-test-build\data\mods\穆尔卡的武器工坊\modinfo.json",
            "windows-test-build\data\mods\穆尔卡的武器工坊\物品\弹药\.408CheyTac.json"
          )
          foreach( $requiredFile in $requiredFiles ) {
            if( -not ( Test-Path -LiteralPath $requiredFile ) ) {
              throw "Embedded weapon workshop file is missing: $requiredFile"
            }
          }

      - name: Upload temporary Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CDDA-Breeze-windows-msvc-test-${{ github.run_number }}
          path: windows-test-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  android:
    name: Android arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Resolve Android Gradle dependencies
        working-directory: ./android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          set -euo pipefail
          chmod +x gradlew

          for attempt in 1 2 3; do
            if ./gradlew --no-daemon help; then
              exit 0
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              echo "Android Gradle dependencies could not be resolved after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Gradle dependency resolution attempt ${attempt} failed; retrying..." >&2
            sleep "$((attempt * 15))"
          done

      - name: Create VERSION.txt
        run: |
          cat > VERSION.txt <<EOF
          build type: android-arm64-test
          workflow run: ${{ github.run_number }}
          branch: ${{ github.ref_name }}
          commit sha: ${{ github.sha }}
          commit url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          EOF

      - name: Compile translations
        run: sh lang/compile_mo.sh all

      - name: Build Android arm64 test APK
        working-directory: ./android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          set -euo pipefail
          cp -r "${{ github.workspace }}/data" "${{ github.workspace }}/android/app/src/main/assets"
          cp -r "${{ github.workspace }}/gfx" "${{ github.workspace }}/android/app/src/main/assets"
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            -Pj="$(nproc)" \
            -Pabi_arm_32=false \
            -Poverride_version="CDDA-Breeze-test-${{ github.run_number }}" \
            -Poverride_versionCode="${{ github.run_number }}" \
            assembleRelease
          APK_PATH="$(find ./app/build/outputs/apk/stable/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            echo "Android Release APK was not generated." >&2
            exit 1
          fi
          cp "${APK_PATH}" \
            "${{ github.workspace }}/CDDA-Breeze-android-arm64-test-${{ github.run_number }}.apk"

      - name: Upload temporary Android build
        uses: actions/upload-artifact@v4
        with:
          name: CDDA-Breeze-android-arm64-test-${{ github.run_number }}
          path: CDDA-Breeze-android-arm64-test-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 7
