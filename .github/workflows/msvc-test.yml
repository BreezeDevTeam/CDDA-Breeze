name: "Windows & Android Test"

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZSTD_CLEVEL: 17
  VCPKG_BINARY_SOURCES: clear
  # Keep the vcpkg revision in one place so dependency resolution and caching
  # cannot silently drift apart.  This revision is also used by upstream DDA.
  VCPKG_COMMIT_ID: f6672d8e480ccdecddfad3fd1b838ba369ffe6cd

jobs:
  preflight:
    name: 快速检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            HEAD_SHA="${GITHUB_SHA}"
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || printf '%s' "${HEAD_SHA}")"
          fi

          echo "base=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/changed-files.txt"
          echo "Changed files:"
          cat "${RUNNER_TEMP}/changed-files.txt"

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ steps.changes.outputs.base }}" "${{ steps.changes.outputs.head }}"

      - name: Validate changed JSON Python and project files
        shell: bash
        env:
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import py_compile
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          changed_file_list = Path(os.environ["CHANGED_FILES"])
          files = [Path(line) for line in changed_file_list.read_text(encoding="utf-8").splitlines() if line.strip()]
          failures = []
          checked = 0

          for path in files:
              if not path.is_file():
                  continue
              suffix = path.suffix.lower()
              try:
                  if suffix == ".json":
                      with path.open("r", encoding="utf-8-sig") as handle:
                          json.load(handle)
                      checked += 1
                  elif suffix == ".py":
                      py_compile.compile(str(path), doraise=True)
                      checked += 1
                  elif suffix in {".xml", ".vcxproj", ".props", ".targets"}:
                      ET.parse(path)
                      checked += 1
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("快速语法检查失败：", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)

          print(f"快速语法检查通过，共检查 {checked} 个 JSON/Python/XML/Visual Studio 项目文件。")
          PY

      - name: Detect unresolved merge markers
        shell: bash
        env:
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          changed_file_list = Path(os.environ["CHANGED_FILES"])
          candidates = []
          checked_suffixes = {
              ".c", ".cc", ".cpp", ".cxx", ".h", ".hh", ".hpp",
              ".json", ".py", ".java", ".kt", ".kts", ".gradle",
              ".yml", ".yaml", ".xml", ".vcxproj", ".props", ".targets",
          }

          for raw in changed_file_list.read_text(encoding="utf-8").splitlines():
              path = Path(raw)
              if not path.is_file() or path.suffix.lower() not in checked_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if line.startswith(("<<<<<<< ", ">>>>>>> ")):
                      candidates.append(f"{path}:{number}: {line}")

          if candidates:
              print("发现疑似未解决的合并冲突标记：", file=sys.stderr)
              print("\n".join(candidates), file=sys.stderr)
              raise SystemExit(1)

          print("未发现未解决的合并冲突标记。")
          PY

      - name: Validate embedded weapon workshop paths
        shell: bash
        run: |
          set -euo pipefail
          test -f "data/mods/穆尔卡的武器工坊/modinfo.json"
          test -f "data/mods/穆尔卡的武器工坊/物品/弹药/408CheyTac.json"

  android-gradle-config:
    name: Android Gradle 快速检查
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Resolve Android Gradle configuration
        working-directory: ./android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon help

  msvc:
    name: Windows Tiles x64 MSVC
    needs: preflight
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-2022
    # Keep a hung toolchain or runner from occupying Actions indefinitely.
    timeout-minutes: 60

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install CMake
        uses: lukka/get-cmake@f176ccd3f28bda569c43aae4894f06b2435a3375 # latest
        with:
          cmakeVersion: 3.31.6

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Configure vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT_ID }}'

      - name: Integrate vcpkg
        run: |
          vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'

      - name: Cache vcpkg installed packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-vcpkg
        with:
          path: msvc-full-features/vcpkg_installed/
          key: vcpkg-${{ hashFiles('msvc-full-features/vcpkg.json', '.github/vcpkg_triplets/x64-windows-static.cmake') }}-${{ env.VCPKG_COMMIT_ID }}

      - name: Install MSYS2
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make

      - name: Create VERSION.txt
        shell: bash
        run: |
          cat >VERSION.txt <<EOL
          build type: windows-tiles-x64-msvc-test
          workflow run: ${{ github.run_number }}
          branch: ${{ github.ref_name }}
          commit sha: ${{ github.sha }}
          commit url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          EOL

      - name: Compile translations
        shell: msys2 {0}
        run: |
          lang/compile_mo.sh all

      - name: Build Windows Tiles x64 MSVC
        env:
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
          VCPKG_BINARY_SOURCES: clear
        run: |
          msbuild -m -p:Configuration=Release -p:Platform=x64 "-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static" msvc-full-features\Cataclysm-vcpkg-static.sln
          .\build-scripts\windist.ps1
          Expand-Archive -LiteralPath cataclysmdda-0.G.zip -DestinationPath windows-test-build -Force

      - name: Dump vcpkg logs if build fails
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $buildtrees = Join-Path '${{ runner.workspace }}' 'b\vcpkg\buildtrees'
          if ( Test-Path -LiteralPath $buildtrees ) {
            Get-ChildItem -LiteralPath $buildtrees -Recurse -File -Filter '*.log' |
              ForEach-Object {
                Write-Host "===== $($_.FullName) ====="
                Get-Content -LiteralPath $_.FullName
              }
          }

      - name: Validate embedded weapon workshop
        shell: pwsh
        run: |
          $requiredFiles = @(
            "windows-test-build\data\mods\穆尔卡的武器工坊\modinfo.json",
            "windows-test-build\data\mods\穆尔卡的武器工坊\物品\弹药\408CheyTac.json"
          )
          foreach( $requiredFile in $requiredFiles ) {
            if( -not ( Test-Path -LiteralPath $requiredFile ) ) {
              throw "Embedded weapon workshop file is missing: $requiredFile"
            }
          }

      # Upload before the smoke test so developers can still download and inspect
      # a successfully compiled package even when runtime data validation fails.
      - name: Upload temporary Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CDDA-Breeze-windows-msvc-test-${{ github.run_number }}
          path: windows-test-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Windows 数据加载烟雾测试
        shell: pwsh
        run: |
          $buildDir = Resolve-Path "windows-test-build"
          $exe = Join-Path $buildDir "cataclysm-tiles.exe"
          if( -not ( Test-Path -LiteralPath $exe ) ) {
            throw "Smoke test executable is missing: $exe"
          }

          $stdout = Join-Path $env:RUNNER_TEMP "breeze-jsonverify.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "breeze-jsonverify.stderr.log"
          $process = Start-Process \
            -FilePath $exe \
            -ArgumentList "--jsonverify" \
            -WorkingDirectory $buildDir \
            -NoNewWindow \
            -PassThru \
            -RedirectStandardOutput $stdout \
            -RedirectStandardError $stderr

          if( -not $process.WaitForExit(180000) ) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "cataclysm-tiles.exe --jsonverify did not finish within 180 seconds."
          }

          $process.Refresh()
          Write-Host "===== jsonverify stdout ====="
          if( Test-Path -LiteralPath $stdout ) { Get-Content -LiteralPath $stdout }
          Write-Host "===== jsonverify stderr ====="
          if( Test-Path -LiteralPath $stderr ) { Get-Content -LiteralPath $stderr }

          if( $process.ExitCode -ne 0 ) {
            throw "cataclysm-tiles.exe --jsonverify failed with exit code $($process.ExitCode)."
          }

          Write-Host "Windows 可执行文件已成功启动并完成核心游戏数据加载验证。"

  android:
    name: Android arm64
    needs:
      - preflight
      - android-gradle-config
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # Keep a hung package mirror or Gradle process from occupying Actions indefinitely.
    timeout-minutes: 60

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Apt can wait indefinitely when a package mirror is unavailable.
          timeout --signal=TERM --kill-after=30s 10m sudo apt-get update
          timeout --signal=TERM --kill-after=30s 5m sudo apt-get install -y gettext

      - name: Resolve Android Gradle dependencies
        working-directory: ./android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          set -euo pipefail
          chmod +x gradlew

          for attempt in 1 2 3; do
            if ./gradlew --no-daemon help; then
              exit 0
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              echo "Android Gradle dependencies could not be resolved after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Gradle dependency resolution attempt ${attempt} failed; retrying..." >&2
            sleep "$((attempt * 15))"
          done

      - name: Create VERSION.txt
        run: |
          cat > VERSION.txt <<EOF
          build type: android-arm64-test
          workflow run: ${{ github.run_number }}
          branch: ${{ github.ref_name }}
          commit sha: ${{ github.sha }}
          commit url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          EOF

      - name: Compile translations
        run: sh lang/compile_mo.sh all

      - name: Build Android arm64 test APK
        working-directory: ./android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          set -euo pipefail
          cp -r "${{ github.workspace }}/data" "${{ github.workspace }}/android/app/src/main/assets"
          cp -r "${{ github.workspace }}/gfx" "${{ github.workspace }}/android/app/src/main/assets"
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            -Pj="$(nproc)" \
            -Pabi_arm_32=false \
            -Poverride_version="CDDA-Breeze-test-${{ github.run_number }}" \
            -Poverride_versionCode="${{ github.run_number }}" \
            assembleRelease
          APK_PATH="$(find ./app/build/outputs/apk/stable/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            echo "Android Release APK was not generated." >&2
            exit 1
          fi
          cp "${APK_PATH}" \
            "${{ github.workspace }}/CDDA-Breeze-android-arm64-test-${{ github.run_number }}.apk"

      - name: Upload temporary Android build
        uses: actions/upload-artifact@v4
        with:
          name: CDDA-Breeze-android-arm64-test-${{ github.run_number }}
          path: CDDA-Breeze-android-arm64-test-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 7
