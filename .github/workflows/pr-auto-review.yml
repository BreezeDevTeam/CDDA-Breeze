name: "微风 PR 自动审查"

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: 变更范围与风险审查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 生成自动审查摘要
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = '<!-- breeze-auto-review -->';
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const additions = files.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.reduce((sum, file) => sum + file.deletions, 0);
            const changedLines = additions + deletions;
            const names = files.map((file) => file.filename);

            const has = (prefix) => names.some((name) => name.startsWith(prefix));
            const matches = (regex) => names.some((name) => regex.test(name));

            const categories = [];
            if (has('src/')) categories.push('C++ 核心代码');
            if (has('data/')) categories.push('游戏数据/模组');
            if (has('android/')) categories.push('Android');
            if (has('msvc-full-features/') || matches(/^\.github\/vcpkg_triplets\//)) categories.push('Windows/MSVC');
            if (has('.github/workflows/')) categories.push('GitHub Actions');
            if (has('lang/')) categories.push('翻译');
            if (has('gfx/')) categories.push('贴图/图形资源');
            if (has('tools/') || has('build-scripts/')) categories.push('工具/构建脚本');
            if (categories.length === 0) categories.push('其他文件');

            const risks = [];
            if (files.length >= 80) risks.push(`变更文件较多（${files.length} 个），建议按提交或功能块审查。`);
            if (changedLines >= 5000) risks.push(`改动行数较大（${changedLines} 行），建议确认不存在无意的大范围格式化。`);
            if (has('.github/workflows/')) risks.push('修改了工作流，请重点检查权限、触发条件以及第三方 Action。');
            if (has('android/')) risks.push('涉及 Android，请确认 Gradle 快速检查和 Android arm64 构建通过。');
            if (has('msvc-full-features/') || matches(/^\.github\/vcpkg_triplets\//)) risks.push('涉及 Windows/MSVC，请确认 Windows Tiles x64 MSVC 构建通过。');
            if (has('src/') && has('data/')) risks.push('同时修改核心代码和数据，建议确认 JSON 数据与新代码接口保持一致。');
            if (matches(/^src\/(savegame|worldfactory|map|mapgen|vehicle|character|item|inventory)/)) risks.push('触及存档、地图、载具、角色或物品核心路径，属于较高回归风险区域。');
            if (matches(/^data\/mods\/穆尔卡的武器工坊\//)) risks.push('修改了穆尔卡的武器工坊，请确认 Windows 构件中的内置模组文件仍然完整。');
            if (/同步|上游|upstream|sync/i.test(pr.title)) risks.push('疑似上游同步 PR，建议保留可追溯的提交边界，避免一次性覆盖整文件。');

            const recommended = ['快速检查'];
            if (has('src/') || has('msvc-full-features/') || has('data/') || has('tools/') || has('build-scripts/')) {
              recommended.push('Windows Tiles x64 MSVC', 'Windows 数据加载烟雾测试');
            }
            if (has('src/') || has('android/') || has('data/') || has('gfx/')) {
              recommended.push('Android Gradle 快速检查', 'Android arm64');
            }

            const uniqueRecommended = [...new Set(recommended)];
            const testDetails = {
              '快速检查': '检查补丁空白、变更 JSON/Python/XML/Visual Studio 项目文件、未解决合并标记，以及内置穆尔卡武器工坊关键路径。',
              'Windows Tiles x64 MSVC': '编译翻译，执行完整 Release x64 MSVC 构建和 windist 打包，并验证 Windows 构件中的内置武器工坊。',
              'Windows 数据加载烟雾测试': '运行打包后的 cataclysm-tiles.exe --jsonverify，确认可执行文件能够真正启动并完成核心游戏数据加载；Windows 构件会先上传，烟雾测试失败时仍可下载人工排查。',
              'Android Gradle 快速检查': '使用 JDK 11 解析 Gradle 配置和依赖，提前发现 Android 构建环境或脚本问题。',
              'Android arm64': '编译翻译和 arm64 Release APK，并保留 APK 构件供设备实测。',
            };
            const testText = uniqueRecommended
              .map((test) => `- **${test}：** ${testDetails[test]}`)
              .join('\n');

            const riskText = risks.length > 0
              ? risks.map((risk) => `- ⚠️ ${risk}`).join('\n')
              : '- ✅ 未发现明显的结构性高风险信号。';

            const body = `${marker}
            ## 🤖 微风自动审查

            本次 PR 共修改 **${files.length}** 个文件，新增 **${additions}** 行，删除 **${deletions}** 行。

            **变更范围：** ${categories.join('、')}

            **自动风险提示：**
            ${riskText}

            **建议测试内容：**
            ${testText}

            这是免费的规则型自动审查，只负责快速发现范围、平台和集成风险，不替代人工代码审查。后续如果我们批量同步上游 PR，它会在每次推送后自动刷新这条摘要。`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });

            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
              core.info(`Updated automatic review comment ${previous.id}.`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
              core.info(`Created automatic review comment ${created.data.id}.`);
            }
