name: sync1191-worker
on:
  push:
    branches:
      - sync1191-worker-finalize
    paths:
      - .github/workflows/sync1191_worker.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 132463fafc5d62e6f0eaca5af878b561d98dd916
      - name: 诊断 79285 整体补丁与核心文件
        shell: bash
        run: |
          set -u
          curl -fsSL https://github.com/CleverRaven/Cataclysm-DDA/pull/79285.diff -o /tmp/79285.diff
          git apply --reject --whitespace=nowarn /tmp/79285.diff || true
          echo '=== REJECT FILES ==='
          find . -name '*.rej' -print | sort
          echo '=== CHANGED FILES ==='
          git status --short | sed -n '1,120p'
          echo '=== CORE EXISTENCE ==='
          for f in data/json/mapgen/nested/gunstore_nested.json data/json/mapgen/s_gun.json data/json/mapgen_palettes/gunstore.json data/json/overmap/overmap_terrain/overmap_terrain_commercial.json; do
            test -f "$f" && echo "EXISTS $f" || echo "MISSING $f"
          done
