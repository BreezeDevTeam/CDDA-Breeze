# 触发 #1191 第三轮旧基线运行时兼容修复
name: sync1191-worker
on:
  push:
    branches: [sync1191-worker-finalize]
    paths: [.github/workflows/sync1191_worker.yml]
permissions:
  contents: write
jobs:
  fix-legacy-runtime-data-round3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: sync/upstream-interesting-batch-02
      - name: 修复第三轮实际启动暴露的旧基线兼容问题并推送
        shell: bash
        run: |
          set -euo pipefail
          expected_head="6f9f65cc996c0493d0b901a540a8f46dbaa273f6"
          [[ "$(git rev-parse HEAD)" == "$expected_head" ]] || { echo "功能分支已移动" >&2; exit 1; }
          git config user.name "ChatGPT Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import json

          # 65097：屋顶实际引用的是通用 roof_palette，而不是 convention_center_palette。
          # 将 v 直接映射到旧基线已有的向下梯子，修复会展中心屋顶 #v# 报错。
          roof = Path('data/json/mapgen_palettes/roof_palette.json')
          s = roof.read_text(encoding='utf-8')
          if '"v": "t_ladder_down"' in s:
              raise SystemExit('roof_palette 已存在 v 映射，拒绝重复修改')
          old = '      "y": "t_null"\n    },'
          new = '      "y": "t_null",\n      "v": "t_ladder_down"\n    },'
          if s.count(old) != 1:
              raise SystemExit('roof_palette v 映射插入点不符合预期')
          roof.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 66402：新版赛车场屋顶使用 t_stairs_down_no_roof，微风 12.0 没有这个地形。
          # 旧版 t_stairs_down 是最接近且已存在的向下楼梯。
          speedway = Path('data/json/mapgen/speedway.json')
          s = speedway.read_text(encoding='utf-8')
          if s.count('t_stairs_down_no_roof') != 1:
              raise SystemExit('赛车场新版楼梯地形引用数量异常')
          speedway.write_text(s.replace('t_stairs_down_no_roof', 't_stairs_down'), encoding='utf-8')

          # 67328：wallet_photo 虽有 BANK_NOTE_SHAPED，但旧基线钱包使用显式 item_restriction，
          # 因此还必须把照片加入钱包的折叠夹层白名单。三处分别对应普通/大号/旅行钱包结构。
          generic = Path('data/json/items/generic.json')
          s = generic.read_text(encoding='utf-8')
          old = '          "family_photo",\n          "money_one",'
          new = '          "family_photo",\n          "wallet_photo",\n          "money_one",'
          if s.count(old) != 3:
              raise SystemExit(f'钱包夹层插入点数量异常: {s.count(old)}')
          generic.write_text(s.replace(old, new), encoding='utf-8')

          # 79285：枪店地图来自更晚的上游数据，清理微风 12.0 中不存在的物品、物品组和墙体 ID。
          # 这里优先映射到旧基线已有且语义接近的对象，避免额外引入新版物品依赖链。
          gunstore = Path('data/json/mapgen_palettes/upstream_79285_gunstore.json')
          s = gunstore.read_text(encoding='utf-8')
          replacements = [
              ('t_wall_gray', 't_wall', 3),
              ('t_wall_black', 't_brick_wall', 3),
              ('gun_lock', 'lock', 2),
              ('ammo_casings_gunsmith_bulk', 'ammo_casings_bulk', 4),
              ('blister_pack', 'wrapper', 1),
              ('bag_plastic_small', 'bag_plastic', 1),
          ]
          for old, new, expected in replacements:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'枪店兼容引用数量异常: {old} = {count}, 预期 {expected}')
              s = s.replace(old, new)
          gunstore.write_text(s, encoding='utf-8')

          touched = [roof, speedway, generic, gunstore]
          for path in touched:
              json.loads(path.read_text(encoding='utf-8'))

          # 对本轮用户实际看到的所有错误做反向断言，同时把同批枪店下一个明显缺失的
          # blister_pack 一并清掉，避免修完一个又弹出下一个。
          forbidden = {
              't_stairs_down_no_roof',
              't_wall_gray',
              't_wall_black',
              'gun_lock',
              'ammo_casings_gunsmith_bulk',
              'blister_pack',
              'bag_plastic_small',
          }
          bad = []
          for path in Path('data/json').rglob('*.json'):
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      bad.append(f'{path}: {token}')
          if bad:
              raise SystemExit('仍存在本轮旧基线缺失引用:\n' + '\n'.join(bad))

          if '"v": "t_ladder_down"' not in roof.read_text(encoding='utf-8'):
              raise SystemExit('roof_palette 的 v -> t_ladder_down 写入失败')
          if generic.read_text(encoding='utf-8').count('"wallet_photo"') < 3:
              raise SystemExit('钱包夹层没有完整接纳 wallet_photo')
          PY
          git diff --check
          git diff --stat
          git add -- \
            'data/json/mapgen_palettes/roof_palette.json' \
            'data/json/mapgen/speedway.json' \
            'data/json/items/generic.json' \
            'data/json/mapgen_palettes/upstream_79285_gunstore.json'
          git diff --cached --check
          git commit -m "修复测试版第三轮运行时兼容问题"
          git push origin HEAD:sync/upstream-interesting-batch-02
