name: sync1191-worker
on:
  push:
    branches:
      - sync1191-worker-finalize
    paths:
      - .github/workflows/sync1191_worker.yml
permissions:
  contents: write
jobs:
  rabbit-final-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: sync/upstream-interesting-batch-02
      - name: 修复 CodeRabbit 终审剩余问题
        shell: bash
        run: |
          set -euo pipefail
          expected="c9afcc86c05d196d46d4b415e2054e3d8b482ab3"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "目标分支已移动：期望 $expected，实际 $actual" >&2
            exit 1
          fi
          git config user.name "ChatGPT Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match in {path}, got {count}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # 1. 按上游 #79285 原始定义，为三个枪店调色板补回 interior_wall_type 参数。
          palette_path = Path("data/json/mapgen_palettes/upstream_79285_gunstore.json")
          palette = palette_path.read_text(encoding="utf-8")
          parameter_block = (
              '    "parameters": {\n'
              '      "interior_wall_type": {\n'
              '        "type": "ter_str_id",\n'
              '        "default": { "distribution": [ [ "t_wall_w", 1 ], [ "t_wall_gray", 1 ], [ "t_wall_black", 1 ] ] }\n'
              '      }\n'
              '    },\n'
          )
          for suffix in ("unlooted", "looted", "occupied"):
              anchor = f'    "id": "gunstore_palette_{suffix}",\n'
              if palette.count(anchor) != 1:
                  raise SystemExit(f"palette anchor mismatch: {suffix}")
              palette = palette.replace(anchor, anchor + parameter_block, 1)
          palette_path.write_text(palette, encoding="utf-8")

          # 2. 修正 JSON 风格，不改变翼型丧尸的嗅觉行为。
          replace_once(
              "data/json/monsters/zed-winged.json",
              '    "scents_tracked": ["sc_human", "sc_fetid"],',
              '    "scents_tracked": [ "sc_human", "sc_fetid" ],',
              "zed-winged scents formatting"
          )

          # 3. 地狱袭击者销赃商与军需官必须能实际打开交易界面。
          npc_path = Path("data/json/npcs/hells_raiders/upstream_67212_npcs.json")
          npc = npc_path.read_text(encoding="utf-8")
          trader_old = '''    "id": "bandit_trader",\n    "name_suffix": "销赃商",\n    "class": "NC_BANDIT_TRADER",\n    "attitude": 0,\n    "mission": 3,\n    "chat": "TALK_DONE",'''
          trader_new = trader_old.replace('"chat": "TALK_DONE"', '"chat": "TALK_BANDIT_SHOPKEEPER"')
          quarter_old = '''    "id": "bandit_quartermaster",\n    "name_suffix": "军需官",\n    "class": "NC_BANDIT_QUARTERMASTER",\n    "attitude": 0,\n    "mission": 3,\n    "chat": "TALK_DONE",'''
          quarter_new = quarter_old.replace('"chat": "TALK_DONE"', '"chat": "TALK_BANDIT_SHOPKEEPER"')
          if npc.count(trader_old) != 1 or npc.count(quarter_old) != 1:
              raise SystemExit("bandit shopkeeper npc anchors mismatch")
          npc = npc.replace(trader_old, trader_new, 1).replace(quarter_old, quarter_new, 1)
          topic = '''  {\n    "type": "talk_topic",\n    "id": "TALK_BANDIT_SHOPKEEPER",\n    "dynamic_line": "要买点什么，还是有东西要出手？",\n    "responses": [\n      { "text": "让我看看你的货。", "topic": "TALK_BANDIT_SHOPKEEPER", "effect": "start_trade" },\n      { "text": "没事了。", "topic": "TALK_DONE" }\n    ]\n  }\n'''
          if not npc.endswith("  }\n]"):
              raise SystemExit("bandit npc file ending mismatch")
          npc = npc[:-4] + "  },\n" + topic + "]"
          npc_path.write_text(npc, encoding="utf-8")

          # 4. 微风旧基线没有 nylon_holster，把其权重并入最接近的通用 holster。
          compat_path = Path("data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json")
          compat = compat_path.read_text(encoding="utf-8")
          if compat.count('{ "item": "holster", "prob": 60 },') != 1:
              raise SystemExit("generic holster anchor mismatch")
          compat = compat.replace('{ "item": "holster", "prob": 60 },', '{ "item": "holster", "prob": 180 },', 1)
          old_tail = '      { "item": "bootstrap", "prob": 15 },\n      { "item": "nylon_holster", "prob": 120 }'
          new_tail = '      { "item": "bootstrap", "prob": 15 }'
          if compat.count(old_tail) != 1:
              raise SystemExit("nylon holster anchor mismatch")
          compat = compat.replace(old_tail, new_tail, 1)
          compat_path.write_text(compat, encoding="utf-8")

          # 5. here 必须保持可变，因为旧基线 map::i_at 没有 const 重载；仅抑制误导性的 clang-tidy 建议。
          replace_once(
              "src/activity_item_handling.cpp",
              '    const zone_type_id zone_type = food ? zone_type_AUTO_EAT : zone_type_AUTO_DRINK;\n    map &here = get_map();\n    const std::unordered_set<tripoint_abs_ms> &dest_set =',
              '    const zone_type_id zone_type = food ? zone_type_AUTO_EAT : zone_type_AUTO_DRINK;\n'
              '    // NOLINTNEXTLINE(misc-const-correctness): map::i_at requires mutable map access on this baseline.\n'
              '    map &here = get_map();\n'
              '    const std::unordered_set<tripoint_abs_ms> &dest_set =',
              "mutable map clang-tidy suppression"
          )

          # 6. 当地点怪物组返回空类型时，保留原先有效的随机幻觉兜底。
          replace_once(
              "src/game.cpp",
              '    if( !spawns.group.is_null() && !one_in( 9 ) ) {\n        hallu = MonsterGroupManager::GetRandomMonsterFromGroup( spawns.group );\n    }',
              '    if( !spawns.group.is_null() && !one_in( 9 ) ) {\n'
              '        const mtype_id local_hallu = MonsterGroupManager::GetRandomMonsterFromGroup( spawns.group );\n'
              '        if( !local_hallu.is_null() ) {\n'
              '            hallu = local_hallu;\n'
              '        }\n'
              '    }',
              "hallucination null fallback"
          )

          for f in (
              "data/json/mapgen_palettes/upstream_79285_gunstore.json",
              "data/json/monsters/zed-winged.json",
              "data/json/npcs/hells_raiders/upstream_67212_npcs.json",
              "data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json",
          ):
              json.loads(Path(f).read_text(encoding="utf-8"))
          PY
          git diff --check
          git status --short
          git add data/json/mapgen_palettes/upstream_79285_gunstore.json \
                  data/json/monsters/zed-winged.json \
                  data/json/npcs/hells_raiders/upstream_67212_npcs.json \
                  data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json \
                  src/activity_item_handling.cpp \
                  src/game.cpp
          git commit -F - <<'MSG'
          修复 #1191 终审剩余适配问题

          按上游原始定义补回枪店调色板的 interior_wall_type 参数，并修正翼型丧尸 JSON 格式。为地狱袭击者销赃商和军需官补充可用的中文交易对话，将旧基线不存在的 nylon_holster 权重并入通用枪套。

          同时保留自动进食逻辑所需的可变 map 引用并窄范围抑制 clang-tidy 误报；地点怪物组返回空类型时继续使用原有有效幻觉作为兜底。
          MSG
          git show --stat --oneline HEAD
          git push origin HEAD:sync/upstream-interesting-batch-02
