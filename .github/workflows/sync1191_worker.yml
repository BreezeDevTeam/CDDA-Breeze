name: sync1191-worker
on:
  push:
    branches:
      - sync1191-worker-finalize
    paths:
      - .github/workflows/sync1191_worker.yml
permissions:
  contents: write
jobs:
  gunstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: sync1191-staging-final
      - name: 兼容回移 79285 枪店重制
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B sync1191-staging-final
          git config user.name "ChatGPT Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          upstream=0ba3e95762478bea74669a3faee36c1526f2fb49
          base="https://raw.githubusercontent.com/CleverRaven/Cataclysm-DDA/${upstream}"
          curl -fsSL "$base/data/json/mapgen/s_gun.json" -o /tmp/up_s_gun.json
          curl -fsSL "$base/data/json/mapgen/nested/gunstore_nested.json" -o /tmp/up_nested.json
          curl -fsSL "$base/data/json/mapgen_palettes/gunstore.json" -o /tmp/up_palette.json
          curl -fsSL "$base/data/json/overmap/multitile_city_buildings.json" -o /tmp/up_city.json
          curl -fsSL "$base/data/json/overmap/overmap_terrain/overmap_terrain_commercial.json" -o /tmp/up_oter.json

          python3 - <<'PY'
          from pathlib import Path
          import copy, json, re

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def dump(path, obj):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 收集旧基线已经存在的 ID，用于兼容映射。
          existing_ids = set()
          for p in Path('data').rglob('*.json'):
              try:
                  obj = json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              stack = [obj]
              while stack:
                  cur = stack.pop()
                  if isinstance(cur, dict):
                      val = cur.get('id')
                      if isinstance(val, str): existing_ids.add(val)
                      elif isinstance(val, list): existing_ids.update(x for x in val if isinstance(x, str))
                      stack.extend(cur.values())
                  elif isinstance(cur, list):
                      stack.extend(cur)

          replacements = {
              't_thconc_floor_no_roof': 't_thconc_floor',
              't_carpet_concrete_red': 't_thconc_floor',
              't_window_bars_curtains': 't_window_bars_alarm',
              't_door_metal_interior_locked': 't_door_metal_locked',
              'f_sandbag_half': 'f_sandbag_wall',
              'f_foot_locker_aluminum': 'f_locker',
              'f_rack_coat': 'f_rack',
              'f_metal_rack': 'f_rack',
              'f_counter_gate_c': 'f_counter',
              'f_cardboard_box': 'f_crate_o',
              'f_atm_off': 'f_console_broken',
              'f_shooting_target': 'f_target'
          }
          param_map = {
              'interior_walls': 't_brick_wall',
              'windows': 't_window_bars_alarm',
              'entrance': 't_door_metal_c',
              'secondary_entrance': 't_door_metal_locked',
              'floor': 't_thconc_floor'
          }

          def compat(obj):
              if isinstance(obj, dict):
                  if set(obj.keys()) == {'param'}:
                      return param_map.get(obj['param'], 't_thconc_floor')
                  out = {}
                  for k, v in obj.items():
                      if k == 'parameters':
                          continue
                      out[k] = compat(v)
                  return out
              if isinstance(obj, list):
                  return [compat(x) for x in obj]
              if isinstance(obj, str):
                  return replacements.get(obj, obj)
              return obj

          # 新枪店主体、四种状态嵌套地图与调色板使用独立文件，保留旧地图定义供旧存档兼容。
          up_s_gun = compat(load('/tmp/up_s_gun.json'))
          up_nested = compat(load('/tmp/up_nested.json'))
          up_palettes = load('/tmp/up_palette.json')
          old_palette = load('data/json/mapgen_palettes/gunstore.json')[0]
          adapted_palettes = []
          for src in up_palettes:
              src = compat(src)
              dst = copy.deepcopy(old_palette)
              dst['id'] = src['id']
              dst['type'] = 'palette'
              for key in ('terrain','furniture','item','items','toilets','traps','nested'):
                  if key in src:
                      if isinstance(src[key], dict) and isinstance(dst.get(key), dict):
                          dst[key].update(src[key])
                      else:
                          dst[key] = src[key]
              # 确保所有新版枪店的保险柜仍走旧 SUS 组，穆尔卡武器工坊会继续扩展这里。
              if 'items' in dst and 'X' in old_palette.get('items', {}):
                  dst['items']['X'] = copy.deepcopy(old_palette['items']['X'])
              adapted_palettes.append(dst)
          dump('data/json/mapgen/upstream_79285_s_gun.json', up_s_gun)
          dump('data/json/mapgen/nested/upstream_79285_gunstore_nested.json', up_nested)
          dump('data/json/mapgen_palettes/upstream_79285_gunstore.json', adapted_palettes)

          # 新版地图引用了 2025 年才细分出的枪械/弹匣组。这里用微风旧基线已有组做兼容别名，
          # 不把整套 2025 枪械生态硬塞进旧版本。
          aliases = {
              'guns_common_boxed': ['guns_common_display'],
              'guns_rifle_common_display': ['guns_common_display'],
              'guns_pistol_common_display': ['guns_common_display'],
              'guns_shotgun_common_display': ['guns_common_display'],
              'mags_common_restricted_packaged': ['mags_common_gunstore','mags_common'],
              'ammo_pistol_common': ['ammo_pistol_common_collection','ammo_common_collection'],
              'ammo_pistol_rare': ['ammo_pistol_rare_collection','ammo_rare_collection'],
              'ammo_rifle_common': ['ammo_rifle_common_collection','ammo_common_collection'],
              'ammo_rifle_rare': ['ammo_rifle_rare_collection','ammo_rare_collection'],
              'ammo_shotgun_common': ['ammo_shotgun_common_collection','ammo_common_collection'],
              'SUS_gunstore_hearing': ['ear_protection'],
              'SUS_gunstore_optics_packaged': ['gunmod_common'],
              'SUS_gunstore_optics_display': ['gunmod_common'],
              'SUS_gunstore_carry_gear': ['SUS_gunstore_gear']
          }
          compat_groups = []
          for new_id, candidates in aliases.items():
              if new_id in existing_ids:
                  continue
              target = next((x for x in candidates if x in existing_ids), None)
              if target is None:
                  raise SystemExit(f'No compatibility target for {new_id}: {candidates}')
              compat_groups.append({
                  'type': 'item_group', 'id': new_id, 'subtype': 'collection',
                  'items': [ { 'group': target } ]
              })
              existing_ids.add(new_id)
          dump('data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json', compat_groups)

          # 保留旧 overmap 定义用于旧存档，同时追加新版 s_gun_a / s_gun_b 建筑。
          city = load('data/json/overmap/multitile_city_buildings.json')
          up_city = load('/tmp/up_city.json')
          have_city = {x.get('id') for x in city if isinstance(x, dict)}
          for obj in up_city:
              if isinstance(obj, dict) and obj.get('id') in {'s_gun_a','s_gun_b'} and obj.get('id') not in have_city:
                  city.append(obj)
          dump('data/json/overmap/multitile_city_buildings.json', city)

          oter = load('data/json/overmap/overmap_terrain/overmap_terrain_commercial.json')
          up_oter = load('/tmp/up_oter.json')
          def ids_of(obj):
              v = obj.get('id') if isinstance(obj, dict) else None
              if isinstance(v, str): return {v}
              if isinstance(v, list): return {x for x in v if isinstance(x, str)}
              return set()
          have_oter = set().union(*(ids_of(x) for x in oter))
          wanted = {'s_gun_a','s_gun_b_range','s_gun_b_store','s_gun_a_roof','s_gun_b_roof','s_gun_b_range_roof'}
          for obj in up_oter:
              ids = ids_of(obj)
              if ids & wanted and not (ids & wanted) <= have_oter:
                  oter.append(obj)
                  have_oter |= ids
          dump('data/json/overmap/overmap_terrain/overmap_terrain_commercial.json', oter)

          # 自然生成权重切到新版枪店；旧定义仍存在，因此老存档和调试生成不会断。
          old_keys = {'s_gun','s_gun_looted','s_gun_1','s_gun_2','s_gun_3','s_gun_3_looted','s_gun_4','s_gun_4_looted','s_gunstore','s_gunstore_looted'}
          def switch_weights(obj):
              if isinstance(obj, dict):
                  if any(k in obj for k in old_keys):
                      for k in old_keys:
                          obj.pop(k, None)
                      obj['s_gun_a'] = 1200
                      obj['s_gun_b'] = 300
                  for v in obj.values(): switch_weights(v)
              elif isinstance(obj, list):
                  for v in obj: switch_weights(v)
          for filename in ['data/json/regional_map_settings.json', 'data/mods/TropiCataclysm/tropical_regional_map_settings.json']:
              p = Path(filename)
              if p.exists():
                  obj = load(filename)
                  switch_weights(obj)
                  dump(filename, obj)

          # #62791 的幸存者枪店不再依赖被移出自然生成池的 s_gunstore，改为作为 s_gun_a 的稀有变体。
          survivor_path = Path('data/json/mapgen/store/upstream_62791_gunstore_survivor.json')
          survivor = load(survivor_path)
          changed = False
          for obj in survivor:
              if obj.get('type') == 'mapgen' and obj.get('om_terrain') == ['s_gunstore']:
                  obj['om_terrain'] = ['s_gun_a']
                  changed = True
          if not changed:
              raise SystemExit('62791 gunstore survivor hook not found')
          dump(survivor_path, survivor)

          # 基础 JSON 语法和引用结构的静态检查。
          check_files = [
              'data/json/mapgen/upstream_79285_s_gun.json',
              'data/json/mapgen/nested/upstream_79285_gunstore_nested.json',
              'data/json/mapgen_palettes/upstream_79285_gunstore.json',
              'data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json',
              'data/json/overmap/multitile_city_buildings.json',
              'data/json/overmap/overmap_terrain/overmap_terrain_commercial.json',
              'data/json/regional_map_settings.json',
              str(survivor_path)
          ]
          for filename in check_files:
              json.loads(Path(filename).read_text(encoding='utf-8'))
          print('79285 adaptation files:', *check_files, sep='\n - ')
          PY

          git diff --check
          git add data/json/mapgen/upstream_79285_s_gun.json \
                  data/json/mapgen/nested/upstream_79285_gunstore_nested.json \
                  data/json/mapgen_palettes/upstream_79285_gunstore.json \
                  data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json \
                  data/json/overmap/multitile_city_buildings.json \
                  data/json/overmap/overmap_terrain/overmap_terrain_commercial.json \
                  data/json/regional_map_settings.json \
                  data/json/mapgen/store/upstream_62791_gunstore_survivor.json
          if git diff --quiet -- data/mods/TropiCataclysm/tropical_regional_map_settings.json; then :; else git add data/mods/TropiCataclysm/tropical_regional_map_settings.json; fi
          git commit -F - <<'MSG'
          同步上游 #79285：重制枪店布局与状态

          枪店现在采用新版布局体系，并会在完整设防、有人占据、遭到洗劫和被彻底翻空等状态之间变化。新版地图增加了更像现实枪店的展示区、储物区、射击场和防御痕迹，让不同枪店的探索风险与收获差异更明显。

          微风适配：保留微风旧基线现有枪械、弹匣和物品组生态，用兼容物品组承接新版地图的分类需求，不引入上游 2025 年后续枪械依赖；旧枪店 overmap 与地图定义保留给旧存档使用，自然生成切换到 s_gun_a / s_gun_b。此前 #62791 的幸存者枪店改接到新版 s_gun_a 稀有变体，穆尔卡武器工坊继续通过 SUS_gunstore_safe 等既有物品组向新版枪店注入内容。

          Upstream-PR: CleverRaven/Cataclysm-DDA#79285
          Original-Author: Holli-Git
          MSG
          git log --oneline -4
          git push --force origin HEAD:sync1191-staging-final
