name: sync1191-worker
on:
  push:
    branches: [sync1191-worker-finalize]
    paths: [.github/workflows/sync1191_worker.yml]
permissions:
  contents: read
jobs:
  diagnose-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: sync/upstream-interesting-batch-02
      - name: 打印三方冲突
        shell: bash
        run: |
          set -euo pipefail
          expected_head="65adf012c8fa428ef15b865ac2b5169a4268382e"
          expected_main="6409b4ae7988824b19fa788b1db912ba1c44857b"
          [[ "$(git rev-parse HEAD)" == "$expected_head" ]] || { echo "功能分支已移动" >&2; exit 1; }
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$expected_main" ]] || { echo "main 已再次移动" >&2; exit 1; }
          git merge --no-ff --no-commit origin/main || true
          echo '=== STATUS ==='
          git status --short
          echo '=== UNMERGED INDEX ==='
          git ls-files -u
          echo '=== FILE STAGES ==='
          for p in \
            'data/json/obsoletion_and_migration_0.H.json' \
            'data/mods/Generic_Guns/obsoletion.json' \
            'data/mods/Generic_Guns/overrides.json'; do
            echo "--- $p ---"
            for stage in 1 2 3; do
              echo "[stage $stage]"
              if git cat-file -e ":$stage:$p" 2>/dev/null; then
                git show ":$stage:$p" | grep -nEi 'psl|303|british|enfield|mag_psl|762x54|lee|no4|smle' | head -80 || true
                echo "lines=$(git show ":$stage:$p" | wc -l)"
              else
                echo '<absent>'
              fi
            done
          done
          p='src/activity_item_handling.cpp'
          echo "--- $p get_auto_consume_moves ---"
          for stage in 1 2 3; do
            echo "[stage $stage]"
            if git cat-file -e ":$stage:$p" 2>/dev/null; then
              git show ":$stage:$p" | awk '
                /int get_auto_consume_moves\(/ { printing=1 }
                printing { print NR ":" $0 }
                printing && /return ACTIVITY_SEARCH_DISTANCE;/ { exit }
              ' | head -260
            else
              echo '<absent>'
            fi
          done
