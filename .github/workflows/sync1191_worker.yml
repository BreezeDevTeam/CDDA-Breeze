# 触发 #1191 全量汉化与枪店枪弹配套修复
name: sync1191-worker
on:
  push:
    branches: [sync1191-worker-finalize]
    paths: [.github/workflows/sync1191_worker.yml]
permissions:
  contents: write
jobs:
  localize-and-fix-gunstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: sync/upstream-interesting-batch-02
      - name: 全量汉化第二批新增文本并修复枪店枪弹配套
        shell: bash
        run: |
          set -euo pipefail
          expected_head="f35ce29ce4f7c80b40fb73bd0a881ceac13cc224"
          [[ "$(git rev-parse HEAD)" == "$expected_head" ]] || { echo "功能分支已移动" >&2; exit 1; }
          git config user.name "ChatGPT Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          cat > /tmp/pr1191_patch.b64 <<'B64'
          [... ELLIPSIZATION ...]
          B64
          tr -d '[:space:]' < /tmp/pr1191_patch.b64 | base64 -d > /tmp/pr1191_patch.gz
          gzip -dc /tmp/pr1191_patch.gz > /tmp/pr1191_patch.diff
          git apply --check /tmp/pr1191_patch.diff
          git apply /tmp/pr1191_patch.diff
          python - <<'PY'
          from pathlib import Path
          import json

          touched = [
            'data/json/furniture_and_terrain/上游兼容_房间隔断.json',
            'data/json/items/wallet_photo.json',
            'data/json/mapgen/drug_lab.json',
            'data/json/overmap/convention_center_compat.json',
            'data/json/overmap/overmap_terrain/overmap_terrain_commercial.json',
            'data/json/overmap/overmap_terrain/overmap_terrain_speedway.json',
            'data/json/scenarios_upstream_65116.json',
            'data/json/snippets/photos.json',
            'data/json/survivor_forest_camp_support.json',
            'data/json/z_upstream_sync/第二批/60972_PSL步枪.json',
            'data/json/z_upstream_sync/第二批/61173_兽装丧尸.json',
            'data/json/z_upstream_sync/第二批/62174_303英制弹药与恩菲尔德步枪.json',
            'data/json/z_upstream_sync/第二批/62688_矿井多结局.json',
            'data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json',
            'data/json/上游兼容_个人照片标志.json',
          ]
          for raw in touched:
              path = Path(raw)
              json.loads(path.read_text(encoding='utf-8'))

          # 用户可见文本回归检查：这些英文原文均来自本 PR 新增内容，汉化后不得残留。
          forbidden = [
              'updated Enfield rifle',
              'An evolution of Britten',
              'Enfield battle rifle',
              'A steel 10-round magazine',
              'malicious mane',
              'feral archaeologist',
              'Mass Quarantine',
              'Middle of nowhere',
              'Challenge - Lost Underground',
              'room divider',
              'A tall piece of furniture used to divide rooms',
              'A small picture of something or somebody important to the owner',
          ]
          bad = []
          for raw in touched:
              text = Path(raw).read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      bad.append(f'{raw}: {token}')
          if bad:
              raise SystemExit('仍残留本次应汉化的英文文本:\n' + '\n'.join(bad))

          # 79285 枪店移植兼容：后仓“盒装枪”不得继续退化为只出空枪的 display 组。
          compat = json.loads(Path('data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json').read_text(encoding='utf-8'))
          boxed = next((x for x in compat if x.get('id') == 'guns_common_boxed'), None)
          if boxed is None:
              raise SystemExit('缺少 guns_common_boxed')
          if boxed.get('subtype') == 'collection':
              raise SystemExit('guns_common_boxed 仍是错误的 collection 兼容')
          items = boxed.get('items', [])
          expected = {'guns_pistol_common': 90, 'guns_rifle_common': 30, 'guns_shotgun_common': 3}
          actual = {x.get('group'): x.get('prob') for x in items if 'group' in x}
          if actual != expected:
              raise SystemExit(f'guns_common_boxed 权重异常: {actual}')
          if any(x.get('group') == 'guns_common_display' for x in items):
              raise SystemExit('guns_common_boxed 仍引用空枪展示组')

          # 本轮没有触碰此前赛车场屋顶兼容，确保第四轮修复仍存在。
          roof = Path('data/json/mapgen_palettes/roof_palette.json').read_text(encoding='utf-8')
          for required in ['"+": "t_door_metal_c"', '">": "t_stairs_down"', '"v": "t_ladder_down"']:
              if required not in roof:
                  raise SystemExit(f'roof_palette 回归: {required}')
          PY
          git diff --check
          git diff --stat
          git add -- \
            'data/json/furniture_and_terrain/上游兼容_房间隔断.json' \
            'data/json/items/wallet_photo.json' \
            'data/json/mapgen/drug_lab.json' \
            'data/json/overmap/convention_center_compat.json' \
            'data/json/overmap/overmap_terrain/overmap_terrain_commercial.json' \
            'data/json/overmap/overmap_terrain/overmap_terrain_speedway.json' \
            'data/json/scenarios_upstream_65116.json' \
            'data/json/snippets/photos.json' \
            'data/json/survivor_forest_camp_support.json' \
            'data/json/z_upstream_sync/第二批/60972_PSL步枪.json' \
            'data/json/z_upstream_sync/第二批/61173_兽装丧尸.json' \
            'data/json/z_upstream_sync/第二批/62174_303英制弹药与恩菲尔德步枪.json' \
            'data/json/z_upstream_sync/第二批/62688_矿井多结局.json' \
            'data/json/z_upstream_sync/第二批/79285_枪店物品组兼容.json' \
            'data/json/上游兼容_个人照片标志.json'
          git diff --cached --check
          git commit -m "汉化第二批上游内容并修复枪店枪弹配套"
          git push origin HEAD:sync/upstream-interesting-batch-02
