name: sync1191-worker
on:
  push:
    branches: [sync1191-worker-finalize]
    paths: [.github/workflows/sync1191_worker.yml]
permissions:
  contents: write
jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: sync/upstream-interesting-batch-02
      - name: 合并最新 main
        shell: bash
        run: |
          set -euo pipefail
          expected_head="65adf012c8fa428ef15b865ac2b5169a4268382e"
          expected_main="6409b4ae7988824b19fa788b1db912ba1c44857b"
          [[ "$(git rev-parse HEAD)" == "$expected_head" ]] || { echo "功能分支已移动" >&2; exit 1; }
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$expected_main" ]] || { echo "main 已再次移动" >&2; exit 1; }
          git config user.name "ChatGPT Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff --no-edit origin/main
          git diff --check HEAD^ HEAD
          git status --short
          git push origin HEAD:sync/upstream-interesting-batch-02
