name: sync1191-worker
on:
  push:
    branches:
      - sync1191-worker-finalize
    paths:
      - .github/workflows/sync1191_worker.yml
permissions:
  contents: write
jobs:
  rabbit-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 741af88cea2f3e56864bd1aab5cac808da6b7916
      - name: 修复中期 CodeRabbit 审查问题
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B sync1191-staging-final
          git config user.name "ChatGPT Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match in {path}, got {n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 1. 会展中心：补齐第三排屋顶 mapgen。
          replace_once(
              'data/json/mapgen/convention_center/convention_center.json',
              '      [ "convention_0_1_2", "convention_1_1_2", "convention_2_1_2", "convention_3_1_2", "convention_4_1_2" ]\n',
              '      [ "convention_0_1_2", "convention_1_1_2", "convention_2_1_2", "convention_3_1_2", "convention_4_1_2" ],\n'
              '      [ "convention_0_2_2", "convention_1_2_2", "convention_2_2_2", "convention_3_2_2", "convention_4_2_2" ]\n',
              'convention roof row'
          )

          # 2. 动物收容所：百分比刷新改用 place_monster，去除 place_monsters 的 density 语义。
          p=Path('data/json/mapgen/upstream_62791_animalshelter_survivor.json'); s=p.read_text(encoding='utf-8')
          start=s.find('      "place_monsters": [')
          end=s.find('      "place_vehicles":',start)
          if start<0 or end<0: raise SystemExit('animal shelter monster block not found')
          block=s[start:end]
          block=block.replace('"place_monsters": [','"place_monster": [',1)
          block=block.replace('"monster": "GROUP_','"group": "GROUP_')
          block=re.sub(r', "density": (?:0\.05|0\.5|1)(?=\s*})','',block)
          if '"monster": "GROUP_' in block or '"density"' in block: raise SystemExit('animal shelter conversion incomplete')
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')

          # 3. 首次对话：在玩家选定首次回应之后再记录 knows_u。
          path='data/json/npcs/other/TALK_ANIMAL_SHELTER_SURVIVOR.json'
          p=Path(path); s=p.read_text(encoding='utf-8')
          speaker='    "speaker_effect": { "effect": { "npc_add_var": "knows_u", "type": "dialogue", "context": "first_meeting", "value": "yes" } },\n'
          if s.count(speaker)!=1: raise SystemExit('animal shelter speaker_effect anchor mismatch')
          s=s.replace(speaker,'',1)
          var='{ "npc_add_var": "knows_u", "type": "dialogue", "context": "first_meeting", "value": "yes" }'
          old='        "success": { "topic": "TALK_WEAPON_DROPPED", "effect": "drop_weapon", "opinion": { "trust": -4, "fear": 3 } },\n        "failure": { "topic": "TALK_DONE", "effect": "hostile" },'
          new=f'        "success": {{ "topic": "TALK_WEAPON_DROPPED", "effect": [ "drop_weapon", {var} ], "opinion": {{ "trust": -4, "fear": 3 }} }},\n        "failure": {{ "topic": "TALK_DONE", "effect": [ "hostile", {var} ] }},'
          if s.count(old)!=1: raise SystemExit('animal shelter intimidate response anchor mismatch')
          s=s.replace(old,new,1)
          old='        "topic": "TALK_NPC_ANIMAL_SHELTER_SURVIVOR_INTRO",\n        "condition": { "not": { "npc_has_var": "knows_u", "type": "dialogue", "context": "first_meeting", "value": "yes" } }'
          new=f'        "topic": "TALK_NPC_ANIMAL_SHELTER_SURVIVOR_INTRO",\n        "effect": {var},\n        "condition": {{ "not": {{ "npc_has_var": "knows_u", "type": "dialogue", "context": "first_meeting", "value": "yes" }} }}'
          if s.count(old)!=1: raise SystemExit('animal shelter friendly response anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 4. 重装军人丧尸：瞄具组本身已带 ACOG，只额外挂肩带。
          replace_once(
              'data/json/z_upstream_sync/第二批/64161_军人丧尸装备.json',
              '{ "group": "military_standard_assault_rifles_sighted", "contents-item": [ "shoulder_strap", "acog_scope" ], "prob": 40,',
              '{ "group": "military_standard_assault_rifles_sighted", "contents-item": "shoulder_strap", "prob": 40,',
              'duplicate ACOG'
          )

          # 5. 穆尔卡弹药袋覆盖定义保留原版 700nx 限制。
          replace_once(
              'data/mods/穆尔卡的武器工坊/物品/原版护具调整/z_上游兼容/62174_303英制弹药袋.json',
              '          "pebble": 60,\n          "50": 60,',
              '          "pebble": 60,\n          "700nx": 60,\n          "50": 60,',
              '700nx ammo pouch restriction'
          )

          # 6. 地点幻觉使用实际生成格 p 所在的 OMT，而不是玩家所在 OMT。
          replace_once(
              'src/game.cpp',
              '    const oter_id &terrain_type = overmap_buffer.ter( get_player_character().global_omt_location() );',
              '    const oter_id &terrain_type = overmap_buffer.ter(\n'
              '        tripoint_abs_omt( ms_to_omt_copy( get_map().getabs( p ) ) ) );',
              'hallucination spawn OMT'
          )

          # JSON 语法检查。
          for f in [
              'data/json/mapgen/convention_center/convention_center.json',
              'data/json/mapgen/upstream_62791_animalshelter_survivor.json',
              'data/json/npcs/other/TALK_ANIMAL_SHELTER_SURVIVOR.json',
              'data/json/z_upstream_sync/第二批/64161_军人丧尸装备.json',
              'data/mods/穆尔卡的武器工坊/物品/原版护具调整/z_上游兼容/62174_303英制弹药袋.json'
          ]:
              json.loads(Path(f).read_text(encoding='utf-8'))
          PY
          git diff --check
          git add data/json/mapgen/convention_center/convention_center.json \
                  data/json/mapgen/upstream_62791_animalshelter_survivor.json \
                  data/json/npcs/other/TALK_ANIMAL_SHELTER_SURVIVOR.json \
                  data/json/z_upstream_sync/第二批/64161_军人丧尸装备.json \
                  data/mods/穆尔卡的武器工坊/物品/原版护具调整/z_上游兼容/62174_303英制弹药袋.json \
                  src/game.cpp
          git commit -F - <<'MSG'
          修复中期 CodeRabbit 审查发现的同步适配问题

          补齐会展中心第三排屋顶地图，修正动物收容所怪物刷新概率和首次见面对话状态记录，避免军人丧尸重复生成 ACOG，并保留穆尔卡弹药袋原有的 700nx 兼容范围。

          同时让地点相关幻觉按实际幻觉生成格所在的 overmap terrain 选取当地怪物群，避免玩家站在区域边界时取错相邻地点的刷新表。
          MSG
          git show --stat --oneline HEAD
          git push --force origin HEAD:sync1191-staging-final
